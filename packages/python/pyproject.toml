[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spendctl-sdk"
version = "0.1.0"
description = "Zero-dependency Python client for the spendctl sidecar: route paid HTTP calls through your spend policy, read budgets and receipts, approve from tooling."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Mirai Studio, Inc.", email = "security@spendctl.dev" }]
keywords = ["spendctl", "x402", "mpp", "agents", "payments", "budget", "approvals", "httpx", "requests"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
# No runtime dependencies. httpx and requests are optional integrations, imported lazily.
dependencies = []

[project.optional-dependencies]
httpx = ["httpx>=0.27"]
requests = ["requests>=2.31"]

[project.urls]
Homepage = "https://spendctl.dev"
Documentation = "https://spendctl.dev/docs/integrations/"
Source = "https://github.com/miraistudio/spendctl-sdk"
Changelog = "https://github.com/miraistudio/spendctl-sdk/blob/main/packages/python/CHANGELOG.md"
Issues = "https://github.com/miraistudio/spendctl-sdk/issues"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "requests>=2.31",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spendctl_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src/spendctl_sdk", "tests", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
