name: Publish

# Publishes @spendctl/client to npm when a `client-v<version>` tag is pushed.
# Auth is npm trusted publishing (OIDC): no token, no 2FA prompt. The trusted
# publisher on npmjs.com must name this repository and this file (publish.yml).

on:
  push:
    tags: ["client-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1; the npm bundled with Node may be older.
      - run: npm install -g npm@latest && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#client-v}"
          version=$(jq -r .version packages/client/package.json)
          if [ "$tag" != "$version" ]; then
            echo "tag client-v$tag does not match packages/client/package.json version $version" >&2
            exit 1
          fi
      - name: Publish @spendctl/client
        working-directory: packages/client
        run: npm publish --access public --provenance
