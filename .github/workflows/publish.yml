name: Publish

# Publishes @spendctl/client to npm when a `client-v<version>` tag is pushed.
# Auth is npm trusted publishing (OIDC): no token, no 2FA prompt. The trusted
# publisher on npmjs.com must name this repository and this file (publish.yml).

on:
  push:
    tags: ["client-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1; the npm bundled with Node may be older.
      - run: npm install -g npm@latest && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#client-v}"
          version=$(jq -r .version packages/client/package.json)
          if [ "$tag" != "$version" ]; then
            echo "tag client-v$tag does not match packages/client/package.json version $version" >&2
            exit 1
          fi
      # Until npm/cli#9969 is fixed, a repository created after 2026-07-15 (immutable OIDC
      # subject claim, which this one has) cannot use trusted publishing: the token exchange
      # fails and npm reports ENEEDAUTH. The owner then publishes by hand from main, and this
      # step lets a re-run of the job finish green instead of failing on the version that is
      # already up.
      - name: Already on npm?
        id: registry
        run: |
          version=$(jq -r .version packages/client/package.json)
          if [ -n "$(npm view "@spendctl/client@$version" version 2>/dev/null)" ]; then
            echo "@spendctl/client@$version is already on npm; nothing to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish @spendctl/client
        if: steps.registry.outputs.published != 'true'
        working-directory: packages/client
        run: npm publish --access public --provenance
