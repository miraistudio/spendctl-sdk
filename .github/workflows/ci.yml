name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - name: npm pack (dry run)
        run: |
          cd packages/client
          pnpm pack --pack-destination "$RUNNER_TEMP" > /dev/null
          tar -tzf "$RUNNER_TEMP"/spendctl-client-*.tgz | sort
          tar -tzf "$RUNNER_TEMP"/spendctl-client-*.tgz | grep -q 'package/LICENSE'
          tar -tzf "$RUNNER_TEMP"/spendctl-client-*.tgz | grep -q 'package/dist/index.js'

  # The client claims to run on Bun and Deno. Keep that claim honest.
  runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Bun imports the built package
        run: bun --eval "const m = await import('./packages/client/dist/index.js'); if (typeof m.wrapFetch !== 'function') process.exit(1)"
      - name: Deno imports the built package
        run: deno eval "const m = await import('./packages/client/dist/index.js'); if (typeof m.wrapFetch !== 'function') Deno.exit(1)"

  # packages/python: spendctl-sdk on PyPI. Same fake-sidecar rule: no network, no wallet.
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: Build and inspect the wheel
        run: |
          uv build
          unzip -l dist/*.whl | awk '{print $4}' | grep -q 'spendctl_sdk/py.typed'
          unzip -l dist/*.whl | awk '{print $4}' | grep -q 'licenses/LICENSE'
          unzip -l dist/*.whl | awk '{print $4}' | grep -q 'licenses/NOTICE'
      - name: The wheel installs without dependencies and imports
        run: |
          uv venv "$RUNNER_TEMP/clean" --python ${{ matrix.python }}
          uv pip install --python "$RUNNER_TEMP/clean/bin/python" dist/*.whl
          "$RUNNER_TEMP/clean/bin/python" -c "import spendctl_sdk; assert callable(spendctl_sdk.pay); print(spendctl_sdk.__version__)"
